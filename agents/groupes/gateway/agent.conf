<!-- Configuration centralisee du groupe "gateway" (vm-gateway, Tyk).
     Poussee automatiquement par le manager aux agents du groupe. -->
<agent_config>

  <!-- Integrite des fichiers : configuration de Tyk (apps, policies, certificats) et des piles Docker -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/opt/tyk</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/home/sysadmin/api-gateway-stack</directories>
    <directories realtime="yes" check_all="yes">/etc/docker</directories>
    <ignore type="sregex">.log$|.swp$</ignore>
    <nodiff type="sregex">\.key$|\.pem$|/\.env$</nodiff>
  </syscheck>

  <!-- Journaux des conteneurs (Tyk Gateway, Tyk Pump, Redis) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
  </localfile>

</agent_config>
